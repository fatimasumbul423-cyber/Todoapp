<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>𝓣𝓸𝓭𝓸 𝓐𝓹𝓹</h1>
            <p class="subtitle" id="taskCount">No tasks yet</p>
        </header>

        <form class="input-box" id="taskForm" autocomplete="off">
            <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="New task" maxlength="120" />
            <button type="submit" id="addBtn" aria-label="Add task">+</button>
        </form>

        <ul id="taskList"></ul>

        <p class="empty" id="emptyState">Nothing to do. Add your first task above.</p>
    </main>
    <script src="script.js"></script>
</body>

</html>
